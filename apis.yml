aid: sempre-health
name: Sempre Health
description: 'Sempre Health is a San Francisco based digital health company, founded in 2015, that operates
  a behavior-based dynamic pricing platform for prescription medications. Working with health plans, pharmacy
  benefit managers and pharmaceutical manufacturers, it enrolls covered members and adjusts their copay
  at the point of fill through SMS outreach: the more consistently a member refills on time, the deeper
  the discount. The company reports more than 19 payer and PBM partners covering roughly 60% of commercially
  insured lives in the United States, availability at retail pharmacies in all 50 states, and HITRUST
  certification alongside a signed BAA with each plan. As of this profile Sempre Health publishes no public
  developer program, API reference, or machine-readable API contract; its own health-plans page describes
  payer integration as sharing a list of eligible members rather than as an API.'
